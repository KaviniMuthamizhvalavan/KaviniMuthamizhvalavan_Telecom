<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <!-- Editable source of architecture/Architecture_Diagram.pdf and architecture.png (render: python -m scripts.build_architecture) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/>
    </marker>
    <style>
      .band { fill: #f6f8fa; stroke: #b9c4cd; stroke-width: 1.2; }
      .bandlbl { font-size: 15px; font-weight: 700; fill: #3c4a55; letter-spacing: 1px; }
      .off { fill: #dbe8f4; stroke: #2f6690; stroke-width: 1.6; }
      .det { fill: #dff0e3; stroke: #2e7d4f; stroke-width: 1.6; }
      .llm { fill: #fbe3d2; stroke: #c0612b; stroke-width: 1.6; }
      .store { fill: #ececec; stroke: #6b7883; stroke-width: 1.6; }
      .ext { fill: #fff; stroke: #c0612b; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .zoom { fill: #fff8f2; stroke: #c0612b; stroke-width: 2.2; }
      .t { font-size: 15px; font-weight: 700; fill: #1d2329; }
      .s { font-size: 11.5px; fill: #3c4a55; }
      .xs { font-size: 10.5px; fill: #3c4a55; }
      .a { stroke: #34495e; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .ad { stroke: #34495e; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr); }
      .ao { stroke: #c0612b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrO); }
      .ag { stroke: #2e7d4f; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; marker-end: url(#arrG); }
      .lbl { font-size: 10.5px; fill: #34495e; font-style: italic; }
    </style>
  </defs>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#0b3d5c">AI-Powered Telecom Network Operations Assistant: architecture</text>
  <text x="30" y="56" class="s">Local execution · Python 3.12 · default LLM Claude Haiku 5.5 via the AICredits gateway · every LLM step has a deterministic fallback (zero-key mode)</text>

  <!-- ============================== OFFLINE BAND ============================== -->
  <rect class="band" x="20" y="70" width="1560" height="300" rx="10"/>
  <text class="bandlbl" x="36" y="92">OFFLINE BUILD  ·  python -m scripts.bootstrap  (no LLM)</text>

  <rect class="off" x="40" y="110" width="250" height="100" rx="8"/>
  <text class="t" x="55" y="135">Dataset</text>
  <text class="s" x="55" y="155">5G NetOps (HF fenar/5g_netops)</text>
  <text class="s" x="55" y="172">100,000 rows × 27 KPI columns</text>
  <text class="s" x="55" y="189">Apache-2.0 · 10k committed sample</text>

  <rect class="off" x="340" y="110" width="270" height="100" rx="8"/>
  <text class="t" x="355" y="135">Preprocessing</text>
  <text class="s" x="355" y="155">normalize · percentile baselines (p75/p90)</text>
  <text class="s" x="355" y="172">19 symptoms → 8 categories + NORMAL</text>
  <text class="s" x="355" y="189">priority P1–P4 · out-of-fold fault risk</text>

  <rect class="off" x="660" y="110" width="250" height="100" rx="8"/>
  <text class="t" x="675" y="135">Chunking</text>
  <text class="s" x="675" y="155">case narratives (1 per record,</text>
  <text class="s" x="675" y="172">abnormal KPIs only, template v1)</text>
  <text class="s" x="675" y="189">runbooks: 1 chunk per section</text>

  <rect class="off" x="960" y="110" width="250" height="100" rx="8"/>
  <text class="t" x="975" y="135">Embeddings</text>
  <text class="s" x="975" y="155">BAAI/bge-small-en-v1.5</text>
  <text class="s" x="975" y="172">384-d, CPU (sentence-transformers)</text>
  <text class="s" x="975" y="189">100k cases + 81 KB chunks</text>

  <rect class="off" x="1260" y="110" width="300" height="100" rx="8"/>
  <text class="t" x="1275" y="135">Vector Database</text>
  <text class="s" x="1275" y="155">ChromaDB (persistent, local)</text>
  <text class="s" x="1275" y="172">collections: cases (100,000), KB (81)</text>
  <text class="s" x="1275" y="189">metadata: state, season, weather, category…</text>

  <path class="a" d="M290,160 L338,160"/>
  <path class="a" d="M610,160 L658,160"/>
  <path class="a" d="M910,160 L958,160"/>
  <path class="a" d="M1210,160 L1258,160"/>

  <!-- side inputs / outputs -->
  <rect class="off" x="660" y="255" width="250" height="70" rx="8"/>
  <text class="t" x="675" y="280">KB runbooks</text>
  <text class="s" x="675" y="300">9 Markdown runbooks (authored,</text>
  <text class="s" x="675" y="316">reviewed; 3GPP / ITU-T refs)</text>
  <path class="a" d="M785,255 L785,212"/>

  <rect class="det" x="340" y="255" width="270" height="70" rx="8"/>
  <text class="t" x="355" y="280">ML training</text>
  <text class="s" x="355" y="300">fault-risk classifier, throughput regressor</text>
  <text class="s" x="355" y="316">leading indicators only (leakage audit)</text>
  <path class="a" d="M475,210 L475,253"/>

  <rect class="store" x="40" y="255" width="250" height="70" rx="8"/>
  <text class="t" x="55" y="280">Models + baselines</text>
  <text class="s" x="55" y="300">joblib models · baselines.json</text>
  <text class="s" x="55" y="316">processed cases.parquet</text>
  <path class="a" d="M340,290 L292,290"/>

  <rect class="store" x="960" y="255" width="250" height="70" rx="8"/>
  <text class="t" x="975" y="280">BM25 index</text>
  <text class="s" x="975" y="300">bm25s keyword index</text>
  <text class="s" x="975" y="316">over the case narratives</text>
  <path class="a" d="M910,205 L985,253"/>

  <!-- ============================== ONLINE BAND ============================== -->
  <rect class="band" x="20" y="390" width="1560" height="600" rx="10"/>
  <text class="bandlbl" x="36" y="412">ONLINE REQUEST  ·  uvicorn src.main:app  +  npm run dev (frontend-react)</text>

  <!-- offline -> online feeds -->
  <path class="a" d="M1410,210 L1410,372 L165,372 L165,443"/>
  <path class="a" d="M1085,325 L1085,372"/>
  <text class="lbl" x="1100" y="366">dense + keyword indexes</text>

  <!-- mandated spine -->
  <rect class="det" x="40" y="445" width="250" height="130" rx="8"/>
  <text class="t" x="55" y="470">Retriever</text>
  <text class="s" x="55" y="490">hybrid: dense (Chroma) + BM25</text>
  <text class="s" x="55" y="507">reciprocal-rank fusion (k = 60)</text>
  <text class="s" x="55" y="524">rerank: symptom overlap + feedback prior</text>
  <text class="s" x="55" y="541">metadata filters, exact masked dense path</text>
  <text class="s" x="55" y="558">KB search by agent role</text>

  <rect class="llm" x="330" y="445" width="250" height="130" rx="8"/>
  <text class="t" x="345" y="470">LLM/RAG Pipeline</text>
  <text class="s" x="345" y="490">evidence packs with citable IDs</text>
  <text class="s" x="345" y="507">LLM client: JSON + 1 repair, cache,</text>
  <text class="s" x="345" y="524">rate limit, circuit breaker,</text>
  <text class="s" x="345" y="541">per-run budget (12 calls / 50K tok),</text>
  <text class="s" x="345" y="558">daily spend cap</text>

  <path class="a" d="M290,510 L328,510"/>
  <path class="a" d="M580,510 L618,510"/>

  <!-- Agents zoom -->
  <rect class="zoom" x="620" y="430" width="560" height="350" rx="10"/>
  <text class="t" x="636" y="455">Agents</text>
  <text class="s" x="700" y="455">LangGraph state graph · judge-requested revision (max 1) · deterministic fallback per node</text>

  <rect class="llm" x="640" y="480" width="118" height="70" rx="7"/>
  <text class="t" x="652" y="505" font-size="13">Classifier</text>
  <text class="xs" x="652" y="523">category, symptoms,</text>
  <text class="xs" x="652" y="538">filters, scope</text>

  <rect class="llm" x="776" y="480" width="118" height="70" rx="7"/>
  <text class="t" x="788" y="505" font-size="13">Analyst</text>
  <text class="xs" x="788" y="523">ranked root causes,</text>
  <text class="xs" x="788" y="538">impact, citations</text>

  <rect class="llm" x="912" y="480" width="118" height="70" rx="7"/>
  <text class="t" x="924" y="505" font-size="13">Recommender</text>
  <text class="xs" x="924" y="523">ordered actions,</text>
  <text class="xs" x="924" y="538">verification</text>

  <rect class="llm" x="1048" y="480" width="118" height="70" rx="7"/>
  <text class="t" x="1060" y="505" font-size="13">Judge</text>
  <text class="xs" x="1060" y="523">scores + rule checks,</text>
  <text class="xs" x="1060" y="538">pass / revise / fail</text>

  <path class="a" d="M758,515 L774,515"/>
  <path class="a" d="M894,515 L910,515"/>
  <path class="a" d="M1030,515 L1046,515"/>
  <path class="ao" d="M1107,480 C1107,462 835,462 835,478"/>

  <!-- deterministic tools -->
  <text class="s" x="640" y="590" font-weight="700">Deterministic tools (no LLM)</text>
  <rect class="det" x="640" y="600" width="166" height="44" rx="6"/>
  <text class="xs" x="650" y="618" font-weight="700">KPI analyzer</text>
  <text class="xs" x="650" y="634">bands, anomalies</text>
  <rect class="det" x="820" y="600" width="166" height="44" rx="6"/>
  <text class="xs" x="830" y="618" font-weight="700">Segment statistics</text>
  <text class="xs" x="830" y="634">co-occurrence lifts</text>
  <rect class="det" x="1000" y="600" width="166" height="44" rx="6"/>
  <text class="xs" x="1010" y="618" font-weight="700">ML predictors</text>
  <text class="xs" x="1010" y="634">fault risk, throughput</text>
  <rect class="det" x="640" y="656" width="166" height="44" rx="6"/>
  <text class="xs" x="650" y="674" font-weight="700">Prioritization + impact</text>
  <text class="xs" x="650" y="690">P1–P4, affected services</text>
  <rect class="det" x="820" y="656" width="166" height="44" rx="6"/>
  <text class="xs" x="830" y="674" font-weight="700">Similar-case search</text>
  <text class="xs" x="830" y="690">via the Retriever</text>
  <rect class="det" x="1000" y="656" width="166" height="44" rx="6"/>
  <text class="xs" x="1010" y="674" font-weight="700">Guardrails</text>
  <text class="xs" x="1010" y="690">injection, scope, PII</text>
  <text class="xs" x="830" y="722">Fallbacks: rules classifier · runbook root causes ·</text>
  <text class="xs" x="830" y="737">runbook actions · rule-only validation</text>
  <text class="xs" x="830" y="754">Reduced mode (no key / circuit open / spend cap):</text>
  <text class="xs" x="830" y="769">rules → retrieve → evidence → deterministic answer</text>

  <path class="ad" d="M835,550 L835,598"/>
  <path class="ad" d="M971,550 L903,598"/>
  <path class="ad" d="M818,690 L812,690 L812,800 L230,800 L230,579"/>
  <text class="lbl" x="470" y="794">tool call: similar cases / runbook sections</text>

  <!-- models to tools -->
  <path class="ad" d="M75,325 L75,380 L1225,380 L1225,622 L1168,622"/>
  <text class="lbl" x="1232" y="440">models + baselines</text>

  <!-- API + UI -->
  <rect class="det" x="1240" y="445" width="150" height="130" rx="8"/>
  <text class="t" x="1253" y="470">API Layer</text>
  <text class="s" x="1253" y="490">FastAPI /api/v1</text>
  <text class="s" x="1253" y="507">13 endpoints</text>
  <text class="s" x="1253" y="524">guardrails first</text>
  <text class="s" x="1253" y="541">error envelope,</text>
  <text class="s" x="1253" y="558">request IDs</text>

  <rect class="det" x="1420" y="445" width="145" height="130" rx="8"/>
  <text class="t" x="1432" y="470">User Interface</text>
  <text class="s" x="1432" y="490">React (NetOps Triage)</text>
  <text class="s" x="1432" y="507">Investigate</text>
  <text class="s" x="1432" y="524">Cases</text>
  <text class="s" x="1432" y="541">Simulate</text>
  <text class="s" x="1432" y="558">Quality</text>

  <path class="a" d="M1180,510 L1238,510"/>
  <path class="a" d="M1390,510 L1418,510"/>

  <!-- external LLM -->
  <rect class="ext" x="330" y="610" width="250" height="78" rx="8"/>
  <text class="t" x="345" y="635">AICredits gateway</text>
  <text class="s" x="345" y="655">external · Claude Haiku 5.5, prepaid</text>
  <text class="s" x="345" y="672">Claude API / NVIDIA = config switch</text>
  <path class="ao" d="M455,575 L455,608"/>

  <!-- stores -->
  <rect class="store" x="330" y="860" width="420" height="100" rx="8"/>
  <text class="t" x="345" y="885">SQLite stores (artifacts/)</text>
  <text class="s" x="345" y="905">app.db: runs, ratings, per-case relevance votes</text>
  <text class="s" x="345" y="922">llm_cache.db: validated LLM replies (repeat queries are free)</text>
  <text class="s" x="345" y="939">llm_spend.db: estimated daily spend (cap LLM_DAILY_BUDGET_USD)</text>
  <path class="ad" d="M455,688 L455,858"/>

  <!-- feedback loop -->
  <path class="ag" d="M1492,575 L1492,910 L752,910"/>
  <text class="lbl" x="1000" y="903" fill="#2e7d4f">feedback: ratings + case relevance votes (POST /feedback)</text>
  <path class="ag" d="M330,925 L120,925 L120,577"/>
  <text class="lbl" x="128" y="900" fill="#2e7d4f">Beta-smoothed prior</text>
  <text class="lbl" x="128" y="914" fill="#2e7d4f">→ rerank (weight 0.1)</text>

  <!-- legend -->
  <rect x="1000" y="800" width="565" height="90" rx="8" fill="#fff" stroke="#b9c4cd"/>
  <text class="s" x="1015" y="822" font-weight="700">Legend</text>
  <rect class="off" x="1015" y="832" width="22" height="14" rx="3"/><text class="xs" x="1043" y="843">offline build step</text>
  <rect class="det" x="1160" y="832" width="22" height="14" rx="3"/><text class="xs" x="1188" y="843">deterministic (no LLM)</text>
  <rect class="llm" x="1330" y="832" width="22" height="14" rx="3"/><text class="xs" x="1358" y="843">LLM component</text>
  <rect class="store" x="1015" y="858" width="22" height="14" rx="3"/><text class="xs" x="1043" y="869">storage / artifact</text>
  <line x1="1160" y1="865" x2="1182" y2="865" stroke="#34495e" stroke-width="1.6" stroke-dasharray="6 4"/><text class="xs" x="1188" y="869">tool call / data read</text>
  <line x1="1330" y1="865" x2="1352" y2="865" stroke="#2e7d4f" stroke-width="1.8" stroke-dasharray="7 4"/><text class="xs" x="1358" y="869">feedback loop</text>
</svg>
